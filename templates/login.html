{% extends "base.html" %}

{% block title %}Giriş Yap | {{ settings.business_title }}{% endblock %}

{% block content %}
<div class="h-2 caution-stripes-slim"></div>

<div class="py-16 sm:py-24 bg-gray-950 flex items-center justify-center px-4">
    <div class="w-full max-w-md">
        
        <div class="text-center mb-8">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-amber-600 to-amber-400 text-black flex items-center justify-center font-black text-3xl mx-auto shadow-xl shadow-amber-500/20 mb-4">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h1 class="text-2xl sm:text-3xl font-black text-white font-heading">Sisteme Giriş</h1>
            <p class="text-sm text-gray-400 mt-1">Yönetici veya Üye olarak hesabınıza erişin</p>
        </div>

        <div class="glass-card rounded-3xl p-8 border border-gray-800 shadow-2xl relative">
            <form action="{{ url_for('login', next=request.args.get('next')) }}" method="POST" class="space-y-5">
                <div>
                    <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-2">
                        Kullanıcı Adı
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-500">
                            <i class="fa-solid fa-user"></i>
                        </span>
                        <input type="text" name="username" required id="username-field"
                            placeholder="Kullanıcı adınızı girin"
                            class="w-full pl-10 pr-4 py-3 bg-gray-800/90 border border-gray-700 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 text-sm">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-2">
                        Şifre
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-500">
                            <i class="fa-solid fa-key"></i>
                        </span>
                        <input type="password" name="password" required id="password-field"
                            placeholder="••••••••"
                            class="w-full pl-10 pr-4 py-3 bg-gray-800/90 border border-gray-700 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 text-sm">
                    </div>
                </div>

                <button type="submit" class="w-full py-3.5 bg-amber-500 hover:bg-amber-400 text-black font-extrabold text-sm rounded-xl uppercase tracking-wider shadow-lg shadow-amber-500/20 transition-all">
                    Giriş Yap
                </button>
            </form>

            <div class="mt-6 pt-6 border-t border-gray-800 text-center">
                <p class="text-xs text-gray-400">
                    Henüz üye değil misiniz? 
                    <a href="{{ url_for('register') }}" class="text-amber-400 font-bold hover:underline">Hemen Üye Olun</a>
                </p>
            </div>
        </div>

    </div>
</div>
{% endblock %}
